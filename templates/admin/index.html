<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurant Billing</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- =========================
     ADMIN LOGIN
========================== -->

<a href="{{ url_for('admin_login') }}"
   class="admin-login-button">

    Admin Login

</a>


<div class="container">


    <!-- =========================
         RESTAURANT HEADER
    ========================== -->

    <div class="header">

        <h1>
            {{ restaurant_name }}
        </h1>

        <p>
            Restaurant Billing System
        </p>

    </div>



    <form action="/generate_bill"
          method="POST">


        <!-- =========================
             CUSTOMER DETAILS
        ========================== -->

        <div class="card">

            <h2>
                Customer Details
            </h2>


            <div class="customer-grid">


                <!-- Customer Name -->

                <div>

                    <label for="customer_name">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        placeholder="Enter customer name"
                    >

                </div>



                <!-- Customer Phone -->

                <div>

                    <label for="customer_phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customer_phone"
                        name="customer_phone"
                        placeholder="Enter phone number"
                        maxlength="10"
                    >

                </div>


            </div>

        </div>



        <!-- =========================
             FOOD ITEMS
        ========================== -->

        <div class="card">

            <h2>
                Food Items
            </h2>


            <div class="products-grid">


                {% for product in products %}


                <div class="product-card">


                    <!-- Food Name -->

                    <h3>

                        {{ product.name }}

                    </h3>



                    <!-- Food Price -->

                    <p class="price">

                        ₹{{ "%.2f"|format(product.price) }}

                    </p>



                    <!-- Product ID -->

                    <input
                        type="hidden"
                        name="item_id"
                        value="{{ product.id }}"
                    >



                    <!-- Quantity -->

                    <label for="quantity{{ product.id }}">

                        Quantity

                    </label>


                    <input
                        type="number"
                        id="quantity{{ product.id }}"
                        name="quantity"
                        value="0"
                        min="0"
                        step="1"
                        oninput="this.value = Math.max(0, this.value)"
                    >


                </div>


                {% endfor %}


            </div>

        </div>



        <!-- =========================
             COUPON
        ========================== -->

        <div class="card">


            <h2>

                Coupon

            </h2>



            <label for="coupon">

                Coupon Code

            </label>



            <input
                type="text"
                id="coupon"
                name="coupon"
                placeholder="Example: WELCOME10"
            >



            <p class="coupon-info">

                Available Coupon:

                <strong>
                    WELCOME10
                </strong>

                - 10% Discount

            </p>


        </div>



        <!-- =========================
             GENERATE BILL
        ========================== -->

        <button
            type="submit"
            class="generate-button"
        >

            Generate Bill

        </button>


    </form>


</div>


</body>

</html>
