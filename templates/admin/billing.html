<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Billing</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1>
            {{ restaurant_name }}
        </h1>

        <p>
            Admin Billing
        </p>

    </div>


    <!-- =========================
         BACK TO DASHBOARD
    ========================== -->

    <a href="{{ url_for('admin_dashboard') }}"
       class="back-button">

        ← Back to Dashboard

    </a>


    <form action="{{ url_for('generate_bill') }}"
          method="POST">


       


        <!-- =========================
             FOOD ITEMS
        ========================== -->

        <div class="card">

            <h2>
                Food Items
            </h2>


            <div class="products-grid">


                {% for product in products %}

                <div class="product-card">


                    <h3>
                        {{ product.name }}
                    </h3>


                    <p class="price">

                        ₹{{ "%.2f"|format(product.price) }}

                    </p>


                    <input
                        type="hidden"
                        name="item_id"
                        value="{{ product.id }}"
                    >


                    <label for="quantity{{ product.id }}">
                        Quantity
                    </label>


                    <input
                        type="number"
                        id="quantity{{ product.id }}"
                        name="quantity"
                        value="0"
                        min="0"
                        step="1"
                    >


                </div>

                {% endfor %}


            </div>

        </div>


        <!-- =========================
           
        <!-- =========================
             GENERATE BILL
        ========================== -->

        <button
            type="submit"
            class="generate-button"
        >

            Generate Bill

        </button>


    </form>


</div>


</body>

</html>
