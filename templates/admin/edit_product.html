<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="edit-container">

    <div class="edit-box">

        <h1>Edit Product</h1>

        <form method="POST">

            <label for="name">
                Product Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ product.name }}"
                required
            >

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ product.category }}"
                required
            >

            <label for="price">
                Price
            </label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ product.price }}"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a href="{{ url_for('admin_products') }}">
            Cancel
        </a>

    </div>

</div>

</body>
</html>
